{% extends 'base.html' %}
{% block title %}New Sale | SalesNexa{% endblock %}
{% block content %}<main class="app-shell"><section class="workspace"><div class="page-heading"><div><span class="eyebrow">SALES OPERATIONS</span><h1>New Sale</h1><p class="muted">The server calculates the verified total from quantity and pricing.</p></div><a class="button ghost" href="{{ url_for('sales_page') }}">Sales history</a></div><section class="panel sale-entry"><form id="newSaleForm"><label>Customer<select name="customer_id"><option value="">Walk-in customer</option>{% for customer in customers %}<option value="{{ customer.id }}">{{ customer.name }}</option>{% endfor %}</select></label><label>Product<select name="product_id" required>{% for product in products %}<option value="{{ product.id }}" data-price="{{ product.selling_price }}">{{ product.name }} | Rs {{ '%.2f'|format(product.selling_price) }} | Stock {{ product.stock }}</option>{% endfor %}</select></label><label>Quantity<input name="quantity" type="number" min="1" value="1" required></label><label>Discount<input name="discount" type="number" min="0" step="0.01" value="0"></label><label>Tax<input name="tax" type="number" min="0" step="0.01" value="0"></label><div class="sale-total"><small>ESTIMATED TOTAL</small><strong id="saleTotal">Rs 0.00</strong></div><button class="button primary" type="submit">Complete sale</button><p class="form-result" id="newSaleResult"></p></form></section></section></main><script>const form=document.getElementById('newSaleForm');const total=document.getElementById('saleTotal');const product=form.product_id;function updateTotal(){const price=Number(product.selectedOptions[0]?.dataset.price||0);total.textContent=`Rs ${(price*Number(form.quantity.value||0)-Number(form.discount.value||0)+Number(form.tax.value||0)).toFixed(2)}`;}form.addEventListener('input',updateTotal);updateTotal();form.addEventListener('submit',async event=>{event.preventDefault();const result=document.getElementById('newSaleResult');const response=await fetch('{{ url_for('create_sale') }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();result.textContent=response.ok?`Sale #${data.sale_id} saved. Verified total: Rs ${data.total.toFixed(2)}.`:(data.error||'Sale could not be saved.');if(response.ok)form.reset();updateTotal();});</script>{% endblock %}
