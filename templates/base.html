<!doctype html><html lang="{{ language|default('en') }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}SalesNexa AI{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/main.css', v='nexaflux-2') }}"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script></head><body><div class="ambient"></div><nav class="topbar"><a class="brand" href="{{ url_for('landing') }}"><span class="logo-mark">S<span>↗</span></span><span>SALESNEXA <b>AI</b></span></a>{% if current_user %}<div class="top-actions"><span>{{ current_user['name'] }} · {{ current_user['role'] }}</span><a href="{{ url_for('notifications') }}" class="notification">◌ {{ unread_count }}</a><a href="{{ url_for('logout') }}" class="text-link">Sign out</a></div>{% else %}<a class="text-link" href="{{ url_for('login') }}">Sign in ↗</a>{% endif %}</nav>{% block content %}{% endblock %}<script src="{{ url_for('static',filename='js/main.js', v='nexaflux-2') }}"></script>{% block scripts %}{% endblock %}</body></html>
