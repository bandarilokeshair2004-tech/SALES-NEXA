{% extends 'base.html' %}{% block content %}<main class="narrow-page"><span class="eyebrow">SYSTEM FEED</span><h1>Notifications</h1>{% for item in notifications %}<article class="feed-item"><span class="status-dot"></span><div><b>{{ item['type'].replace('_',' ') }}</b><p>{{ item['message'] }}</p></div><time>{{ item['created_at'] }}</time></article>{% else %}<div class="empty"><h2>Nothing needs your attention.</h2><p>No notifications yet.</p></div>{% endfor %}</main>{% endblock %}
